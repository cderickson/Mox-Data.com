{% extends 'base.html' %}

{% block title %}Mox Data - Register{% endblock %}
{% block page_title %}Register{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
{% endblock %}

{% block content %}




    <div class="auth-container">
      <div>
        <div class="card-content">
          <div class="section-header">
            <h2 class="section-title">Create Your Account</h2>
          </div>
          <form action="/email" method="POST">
            
            <div class="form-group">
              <label for="reg_email" class="form-label">Email Address</label>
              <input type="text" class="form-input" id="reg_email" name="email" placeholder="Enter your email address" value="{{ inputs.0 if inputs else '' }}" autocomplete="email" required>
              <div id="reg-email-indicator" style="margin-top: 8px; font-size: 13px; font-weight: 500; height: 18px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden;"></div>
            </div>
            
            <div class="form-group">
              <label for="reg_pwd" class="form-label">Password</label>
              <div>
                <input type="password" class="form-input" id="reg_pwd" name="pwd" placeholder="Create a strong password" value="{{ inputs.1 if inputs else '' }}" required>
                <button type="button" class="password-toggle">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <!-- <div class="password-strength"></div> -->
            </div>
            
            <div class="form-group">
              <label for="reg_pwd_confirm" class="form-label">Confirm Password</label>
              <div>
                <input type="password" class="form-input" id="reg_pwd_confirm" name="pwd_confirm" placeholder="Confirm your password" value="{{ inputs.2 if inputs else '' }}" required>
                <button type="button" class="password-toggle">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div id="password-match-indicator"></div>
            </div>
            
            <div class="form-group">
              <label for="reg_hero" class="form-label">MTGO Username</label>
              <input type="text" class="form-input" id="reg_hero" name="hero" placeholder="Enter your MTGO username" value="{{ inputs.3 if inputs else '' }}" required>
              <div id="reg-username-indicator" style="margin-top: 8px; font-size: 13px; font-weight: 500; height: 18px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden;"></div>
            </div>

            <button type="submit" class="auth-button">
              <i class="fas fa-check"></i>
              Create Account
            </button>
            
            <div class="auth-links">
              <p>Already have an account?</p>
              <a href="/login">Sign In Instead</a>
            </div>
            
          </form>
        </div>
      </div>
    </div>





<script>

      // Update icon
      const icon = this.querySelector('i');
      if (icon) {
        icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
      }
    });
  });

    if (score === 0) {

    strengthIndicator.textContent = `Strength: ${strengthTexts[score]}`;

  // Password confirmation matching
  const confirmInput = document.getElementById('reg_pwd_confirm');
  const matchIndicator = document.getElementById('password-match-indicator');
  
  function checkPasswordMatch() {
    const password = (passwordInput.value || '');
    const confirmPassword = (confirmInput.value || '');

    if (!password && !confirmPassword) {
      setIndicator(matchIndicator, 'Use at least 6 characters.', helperColor);
      return;
    }

    if (password.length < 6) {
      setIndicator(matchIndicator, '✗ Password must be at least 6 chars', '#b91c1c');
      return;
    }

    if (!confirmPassword) {
      setIndicator(matchIndicator, 'Confirm your password to validate.', helperColor);
      return;
    }

    if (password === confirmPassword) {
      setIndicator(matchIndicator, '✓ Passwords match', '#15803d');
    } else {
      setIndicator(matchIndicator, '✗ Passwords do not match', '#b91c1c');
    }
  }
  
  if (confirmInput && matchIndicator) {
    confirmInput.addEventListener('input', checkPasswordMatch);
    passwordInput.addEventListener('input', checkPasswordMatch);
  }

  // Form validation
  const form = document.querySelector('form');
  const emailInput = document.getElementById('reg_email');
  const emailIndicator = document.getElementById('reg-email-indicator');
  const usernameInput = document.getElementById('reg_hero');
  const usernameIndicator = document.getElementById('reg-username-indicator');
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const helperColor = '#6b7280';

  function setIndicator(el, text, color) {
    if (!el) return;
    el.textContent = text;
    el.style.color = color;
  }

  function validateEmailField(showInvalidIndicator = false) {
    if (!emailInput || !emailIndicator) return true;
    const email = (emailInput.value || '').trim();
    const isValid = !!email && emailRegex.test(email);
    if (!email) {
      setIndicator(emailIndicator, 'Use format: name@example.com', helperColor);
      return false;
    }

    if (isValid) {
      setIndicator(emailIndicator, '✓ Valid email', '#15803d');
    } else if (showInvalidIndicator) {
      setIndicator(emailIndicator, '✗ Invalid email format', '#b91c1c');
    } else {
      setIndicator(emailIndicator, 'Use format: name@example.com', helperColor);
    }
    return isValid;
  }

  if (emailInput) {
    emailInput.addEventListener('input', () => {
      // Show live status once user starts typing.
      if ((emailInput.value || '').trim()) {
        validateEmailField(true);
      } else {
        setIndicator(emailIndicator, 'Use format: name@example.com', helperColor);
      }
    });
    emailInput.addEventListener('blur', () => validateEmailField(true));
  }

  function validateUsernameField(showInvalidIndicator = false) {
    if (!usernameInput || !usernameIndicator) return true;
    const username = (usernameInput.value || '').trim();
    const isValid = username.length >= 3 && username.length <= 20;

    if (!username) {
      setIndicator(usernameIndicator, 'This helps us identify your game logs.', helperColor);
      return false;
    }

    if (isValid) {
      setIndicator(usernameIndicator, '✓ Valid username', '#15803d');
    } else if (showInvalidIndicator) {
      setIndicator(usernameIndicator, '✗ Username must be 3-20 chars', '#b91c1c');
    } else {
      setIndicator(usernameIndicator, 'This helps us identify your game logs.', helperColor);
    }
    return isValid;
  }

  if (usernameInput) {
    usernameInput.addEventListener('input', () => {
      if ((usernameInput.value || '').trim()) {
        validateUsernameField(true);
      } else {
        setIndicator(usernameIndicator, 'This helps us identify your game logs.', helperColor);
      }
    });
    usernameInput.addEventListener('blur', () => validateUsernameField(true));
  }

  if (form) {
    form.addEventListener('submit', function(e) {
      const email = document.getElementById('reg_email').value;
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;
      const username = document.getElementById('reg_hero').value;
      const normalizedUsername = (username || '').trim();
      
      // Show specific email error first when present but invalid.
      if ((email || '').trim() && !validateEmailField(true)) {
        e.preventDefault();
        return;
      }

      // Basic validation
      if (!email || !password || !confirmPassword || !normalizedUsername) {
        e.preventDefault();
        alert('Please fill in all fields.');
        return;
      }

      if (!validateUsernameField(true)) {
        e.preventDefault();
        return;
      }
      
      if (password.length < 6) {
        e.preventDefault();
        checkPasswordMatch();
        confirmInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        e.preventDefault();
        checkPasswordMatch();
        confirmInput.focus();
        return;
      }
      
      // If we get here, form is valid
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<span class="spinner"></span> Creating Account...';
      submitBtn.disabled = true;
    });
  }

  // Auto-focus on first input
  const firstInput = document.getElementById('reg_email');
  if (firstInput) {
    firstInput.focus();
  }

  // Initialize helper text rows for consistent card height without empty space.
  validateEmailField(false);
  validateUsernameField(false);
  checkPasswordMatch();
});
</script>

{% endblock %}
